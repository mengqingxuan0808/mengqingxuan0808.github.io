<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7fc1"/>
    </marker>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1743f"/>
    </marker>
  </defs>

  <!-- ============ 左：场景 ============ -->
  <text x="60" y="40" font-size="22" fill="#666">① 场景</text>
  <path d="M 60 320 A 150 150 0 0 1 360 320" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="320" x2="380" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 顶点 A 与球心 O -->
  <circle cx="210" cy="170" r="2.5" fill="#333"/>
  <text x="198" y="156" font-size="21" fill="#333" font-style="italic">A</text>
  <circle cx="210" cy="320" r="2.5" fill="#333"/>
  <text x="196" y="342" font-size="21" fill="#333" font-style="italic">O</text>

  <!-- 半径 R（虚线） -->
  <line x1="210" y1="320" x2="302" y2="202" stroke="#2f7fc1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="262" y="284" font-size="20" fill="#2f7fc1" font-style="italic">R</text>

  <!-- 绳 -->
  <line x1="210" y1="170" x2="302" y2="202" stroke="#333" stroke-width="1.6"/>
  <text x="256" y="216" font-size="20" fill="#333" font-style="italic">L</text>

  <!-- 小球 -->
  <circle cx="302" cy="202" r="13" fill="#f7d9c4" stroke="#333" stroke-width="1.6"/>
  <text x="316" y="196" font-size="20" fill="#333" font-style="italic">P</text>

  <!-- 三个力 -->
  <line x1="302" y1="202" x2="302" y2="292" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="308" y="292" font-size="20" fill="#333">mg</text>

  <line x1="302" y1="202" x2="352" y2="138" stroke="#2f7fc1" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="356" y="136" font-size="20" fill="#2f7fc1">N</text>

  <line x1="302" y1="202" x2="244" y2="181" stroke="#d1743f" stroke-width="1.8" marker-end="url(#arrowWarm)"/>
  <text x="236" y="168" font-size="20" fill="#d1743f">T</text>

  <text x="60" y="380" font-size="19" fill="#666">小球受三个力：重力 mg、支持力 N（沿半径向外）、拉力 T（沿绳指向 A）</text>

  <!-- ============ 中：几何三角形 ============ -->
  <text x="470" y="40" font-size="22" fill="#666">② 几何三角形 O-A-P</text>
  <polygon points="560,340 560,170 665,225" fill="#f3f8fd" stroke="#999" stroke-width="1.4"/>
  <text x="548" y="360" font-size="20" fill="#333" font-style="italic">O</text>
  <text x="548" y="166" font-size="20" fill="#333" font-style="italic">A</text>
  <text x="670" y="222" font-size="20" fill="#333" font-style="italic">P</text>
  <text x="520" y="262" font-size="19" fill="#2f7fc1" font-style="italic">R</text>
  <text x="607" y="296" font-size="19" fill="#2f7fc1" font-style="italic">R</text>
  <text x="600" y="182" font-size="19" fill="#333" font-style="italic">L</text>

  <!-- ============ 右：力三角形 ============ -->
  <text x="740" y="40" font-size="22" fill="#666">③ 力三角形（与②相似）</text>
  <polygon points="800,340 800,170 905,225" fill="#fdf5ef" stroke="#999" stroke-width="1.4"/>
  <text x="742" y="262" font-size="19" fill="#333">mg</text>
  <text x="845" y="296" font-size="19" fill="#2f7fc1">N</text>
  <text x="838" y="182" font-size="19" fill="#d1743f">T</text>

  <!-- 对应关系说明 -->
  <text x="470" y="410" font-size="20" fill="#333">三组边分别平行 → 两三角形相似</text>
  <text x="470" y="440" font-size="21" fill="#333" font-style="italic">T / L = N / R = mg / R</text>
  <text x="470" y="470" font-size="20" fill="#666">所以 N = mg（不变），T = mg·L / R（随绳变短而减小）</text>
</svg>